<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="body">
        <div class="container-1">
            <div class="logo">
                <img src="images/odin-lined.png" alt="odin">
                <h1>ODIN</h1>
            </div>
        </div>
        <div class="container-2">
            <div class="first">
                <p>
                    This is not a real online service!
                    You know you need something like this in your life to help you realize your deepest dreams.
                    Sign up <em>now</em> to get started.
                </p>
                <p>
                    You know you want to.
                </p>
            </div>
            <form action="" class="form">
                <div class="second">
                    <p>Let's do this!</p>
                    <div class="form-row">
                        <label>
                            First Name: <input type="text" name="fname" maxlength="20" required>
                            <span></span>
                        </label>
                        <label>
                            Last Name: <input type="text" name="lname" maxlength="20" required>
                            <span></span>
                        </label>
                    </div>
                    <div class="form-row">
                        <label>
                            Email: <input type="email" name="email">
                        </label>
                        <label>
                            Phone Number: <input type="tel" name="phone">
                        </label>
                    </div>
                    <div class="form-row">
                        <label>
                            Password: <input type="password" name="password" minlength="8">
                            <span></span>
                        </label>
                        <label>
                            Confirm Password: <input type="password" name="password">
                        </label>
                    </div>
                </div>
                <div class="third">
                    <button type="submit">Create Account</button>
                    <p>
                        Already have an account? <a href="#">Login</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
